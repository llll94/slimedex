name: Merge da base colaborativa (a cada 15 min)

on:
  schedule:
    - cron: '2,17,32,47 * * * *'  # a cada 15 min, fora dos minutos redondos (na virada da hora o GitHub atrasa mais)
  workflow_dispatch:       # botão "Run workflow" na aba Actions

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-comunidade
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Consolidar envios do Supabase
        id: consolidar
        env:
          SUPABASE_URL: https://pwletsegcprygxgoduvp.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/merge-comunidade.js

      - name: Abrir ou atualizar o PR (só se mudou algo)
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO: ${{ steps.consolidar.outputs.auto }}
        run: |
          if git diff --quiet -- comunidade.json && [ -z "$(git status --porcelain -- comunidade.json)" ]; then
            echo "Nada novo hoje."; exit 0
          fi
          branch="comunidade/atualizacao"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add comunidade.json
          git commit -m "Base colaborativa: atualização de $(date -u +%Y-%m-%d)"
          git push -f origin "$branch"
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "Base colaborativa — $(date -u +%Y-%m-%d)" --body-file resumo-merge.md
          else
            gh pr create --base main --head "$branch" --title "Base colaborativa — $(date -u +%Y-%m-%d)" --body-file resumo-merge.md
          fi
          # tudo dentro do padrão da base: aprova sozinho (squash = um commit só, fácil de reverter pelo botão Revert do PR)
          if [ "$AUTO" = "true" ]; then
            for i in 1 2 3 4 5; do
              gh pr merge "$branch" --squash --delete-branch && exit 0
              sleep 10
            done
            echo "::warning::Não consegui fazer o merge automático; o PR ficou aberto para revisão."
          else
            echo "Fora do padrão: PR aberto para revisão manual."
          fi
