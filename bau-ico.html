<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Slimedex · Baú</title><style>
/* ícone do baú no estilo do HUD do jogo (cores da mochila: #A3E8FF, #63BCED, #26496E, #52C698).
   Arrasta para mover; clique abre/fecha o baú no Slimedex; com o mouse em cima aparece o botão Capturar embaixo dele (usar com o
   baú do jogo aberto). Medidas em unidades de uma tela 2K (janela 92×132); #u escala para a tela da pessoa. Fora do ícone/botão
   o clique passa para o jogo. O resultado da captura o Slimedex conta num balão de fala. */
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;font-family:system-ui,sans-serif}
#u{position:absolute;left:0;top:0;width:92px;height:132px;transform-origin:0 0}
#b{position:absolute;left:0;top:0;width:92px;height:92px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;transition:transform .12s}
#b:hover{transform:scale(1.08)}#b:active{cursor:grabbing}
svg{width:72px;height:72px;pointer-events:none;filter:drop-shadow(0 0 6px rgba(0,0,0,.34)) drop-shadow(0 0 1.6px rgba(0,0,0,.22))} /* sombra preta bem difusa, igual à dos ícones do jogo */
#cap{position:absolute;left:4px;right:4px;top:96px;height:32px;border:0;border-radius:16px;background:#63BCED;color:#26496E;font:900 14px/32px system-ui;cursor:pointer;padding:0;
 box-shadow:inset 0 -4px 0 #A3E8FF,0 0 6px rgba(0,0,0,.34);opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cap:hover{background:#7ACBF2}#cap.ve{opacity:1}#cap:disabled{cursor:default}
</style></head><body><div id="u"><div id="b" class="hit"><svg viewBox="4 5 56 55"><!-- opção A3: borda clara fina em cima e grossa embaixo, azul médio liso, escuro entre as peças -->
<rect x="11" y="24" width="42" height="5.5" fill="#26496E"/>
<path d="M11.5 25 L14.3 11.5 L23 18.8 H41 L49.7 11.5 L52.5 25 Z" fill="#A3E8FF" stroke="#A3E8FF" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M14 21.6 L15.9 15.3 L22.6 20.6 H41.4 L48.1 15.3 L50 21.6 Z" fill="#63BCED" stroke="#63BCED" stroke-width="1" stroke-linejoin="round"/>
<path d="M16.6 17.6 L17.6 20.6 M47.4 17.6 L46.4 20.6" stroke="#26496E" stroke-width="2" stroke-linecap="round"/>
<rect x="9" y="28.5" width="46" height="26" rx="7" fill="#A3E8FF"/>
<rect x="11" y="30.3" width="42" height="19.2" rx="5.5" fill="#63BCED"/>
<rect x="26" y="22.5" width="12" height="13" rx="3.5" fill="#26496E"/><rect x="29.4" y="26" width="5.2" height="5.6" rx="1.5" fill="#52C698"/>
</svg></div><button id="cap" class="hit"></button></div>
<script src="i18n.js"></script>
<script>
const u=document.getElementById('u'),b=document.getElementById('b'),cap=document.getElementById('cap');let drag=null,lendo=false,volta=0;
u.style.transform=`scale(${innerWidth/92})`;
const textos=()=>{b.title=t('bau_titulo');cap.textContent=t('bau_capturar');cap.title=t('bau_capturar_tip')};textos();
bau.onIdioma(l=>{LANG=l;textos()}); // trocou o idioma no painel
// só o ícone e o botão (quando aparece) pegam o mouse: o main confere o cursor nesses retângulos; o botão aparece com o
// mouse no ícone e fica enquanto ele estiver no botão
let pega=false;
const alvos=()=>bau.alvos([b,...(cap.classList.contains('ve')?[cap]:[])].map(e=>{const r=e.getBoundingClientRect();return[r.left,r.top,r.width,r.height]}));
const ve=on=>{const a=cap.classList.contains('ve');cap.classList.toggle('ve',on);if(a!==cap.classList.contains('ve'))alvos()}; // só com o mouse em cima
document.addEventListener('mousemove',e=>{pega=!!e.target.closest('.hit');ve(pega)});
document.addEventListener('mouseleave',()=>{pega=false;ve(false)});
alvos();
b.onpointerdown=e=>{if(e.button)return;b.setPointerCapture(e.pointerId);drag={x:e.screenX,y:e.screenY,moved:false};bau.dragStart()};
b.onpointermove=e=>{if(!drag)return;if(!(e.buttons&1)){drag=null;bau.dragEnd();return}
 if(!drag.moved&&Math.hypot(e.screenX-drag.x,e.screenY-drag.y)>4)drag.moved=true;if(drag.moved)bau.dragMove()};
b.onpointerup=()=>{const d=drag;drag=null;bau.dragEnd();if(d&&!d.moved)bau.alterna()}; // clique sem arrastar: abre/fecha o baú
// Capturar: o baú lê a tela (com o baú do jogo aberto) e guarda; o resultado aparece no próprio botão por alguns segundos
cap.onclick=()=>{if(lendo)return;lendo=true;cap.disabled=true;pega=false;ve(false);bau.capturarAgora()}; // clicou, o botão some; o "lendo…" o Slimedex fala no balão
bau.onDentro(d=>{if(!d){pega=false;ve(false)}}); // o main avisa quando o mouse sai do ícone/botão (o mouseleave nem sempre chega)
bau.onResultado(()=>{lendo=false;cap.disabled=false;cap.textContent=t('bau_capturar');ve(pega)}); // o que aconteceu, o Slimedex conta no balão
</script></body></html>
