<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Slimepédia</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font:13px system-ui,sans-serif;color:#e8eaed;user-select:none}
#ico{width:56px;height:56px;margin:4px;border-radius:50%;background:rgba(14,19,21,.72);display:flex;align-items:center;justify-content:center;cursor:grab;transition:transform .12s;box-shadow:0 2px 8px #0008;touch-action:none}
#ico:hover{transform:scale(1.12)}#ico:active{cursor:grabbing}#ico img{width:50px;pointer-events:none}
#pn{height:100%;display:flex;flex-direction:column;background:rgba(24,28,33,.95);border:1px solid #2d333a;border-radius:14px;overflow:hidden}
#hd{display:flex;gap:6px;padding:8px;-webkit-app-region:drag;border-bottom:1px solid #2d333a}#hd *{-webkit-app-region:no-drag}
input{flex:1;background:#14171a;color:inherit;border:1px solid #2d333a;border-radius:8px;padding:6px 9px;font:inherit;user-select:text}
button{background:none;border:0;color:#9aa3ad;font-size:16px;cursor:pointer}button:hover{color:#fff}
#bd{flex:1;overflow-y:auto;padding:6px 8px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a414a;border:2px solid transparent;border-radius:8px;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:#56606c}.mu{color:#9aa3ad;font-size:11px}
.row{display:flex;align-items:center;gap:8px;padding:4px 2px;border-radius:8px;cursor:pointer}.row:hover{background:#262c33}
.row.on{background:#2b3440;box-shadow:inset 0 0 0 1px #6aa8ff}
.row img,.row i{width:54px;height:54px;object-fit:contain;flex:none}
.fh{display:flex;gap:10px;align-items:center}.fh img{width:80px;height:80px;object-fit:contain}
h4{margin:10px 0 4px;font-size:11px;color:#9aa3ad;text-transform:uppercase}
.rc{display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:3px 0;border-top:1px solid #2d333a}.rc img{width:24px;height:24px;object-fit:contain}
.lk{color:#6aa8ff;cursor:pointer}
</style></head><body>
<div id="ico" title="Slimepédia (Ctrl+Tab) — arraste para mover"><img src="icon.svg" alt=""></div>
<div id="pn" hidden><div id="hd"><input id="qi" placeholder="buscar slime  (↓ ↑ navega · Enter abre · Esc fecha)"><button id="x" title="Fechar (Esc)">✕</button></div><div id="bd"></div></div>
<script src="data.js"></script>
<script>
const S=D.slimes,C=D.combos,K={},BASE='https://world-of-slime-wiki.vercel.app';S.forEach(s=>K[s.k]=s);
const ALL=[...S].sort((a,b)=>(a.n??1e9)-(b.n??1e9)||a.nm.localeCompare(b.nm)); // numerados primeiro, depois por nome
const norm=t=>(t||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const esc=t=>(t??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const im=p=>p?`<img alt="" src="imagens${p}" onerror="this.onerror=null;this.src='${BASE}${p}'">`:'<i class="mu">?</i>';
const nm=k=>K[k]?K[k].nm:k,made={},used={};
C.forEach(c=>{if(c.r)(made[c.r]=made[c.r]||[]).push(c);new Set([c.a,c.b]).forEach(k=>(used[k]=used[k]||[]).push(c))});
S.forEach(s=>s.h=norm([s.nm,...s.al,s.n,s.el.join(' '),s.lc.join(' ')].join(' ')));
// histórico: últimas 3 fichas abertas
const REC='recentes';let rec=[];try{rec=(JSON.parse(localStorage.getItem(REC))||[]).filter(k=>K[k])}catch{}
function lembra(k){rec=[k,...rec.filter(x=>x!==k)].slice(0,3);try{localStorage.setItem(REC,JSON.stringify(rec))}catch{}}
let sel=-1; // linha destacada pelo teclado
function row(s){return`<div class="row" data-k="${esc(s.k)}">${im(s.im)}<div><b>${s.n!=null?'#'+s.n+' ':''}${esc(s.nm)}</b><div class="mu">${esc(s.el.join(' / '))}</div></div></div>`}
function list(){const q=qi.value.trim();sel=-1;
 if(!q)bd.innerHTML=(rec.length?`<h4>Recentes</h4>${rec.map(k=>row(K[k])).join('')}<h4>Todos (${S.length})</h4>`:'')+ALL.map(row).join('');
 else{const w=norm(q).split(/\s+/);bd.innerHTML=ALL.filter(s=>w.every(x=>s.h.includes(x))).map(row).join('')||'<p class="mu">Nada encontrado.</p>'}
 bd.scrollTop=0}
const lk=k=>K[k]?`<span class="lk" data-k="${esc(k)}">${esc(nm(k))}</span>`:esc(k||'?');
const rc=(c,res)=>`<div class="rc">${res?`${im(K[c.r]?.im)}${lk(c.r)} =`:''}${im(K[c.a]?.im)}${lk(c.a)} + ${im(K[c.b]?.im)}${lk(c.b)}${c.m?` <span class="mu">· ${esc(c.m)}</span>`:''}${c.l!==''?` <span class="mu">· nv ${esc(c.l)}</span>`:''}</div>`;
function ficha(k){const s=K[k],m=made[k]||[],u=used[k]||[];lembra(k);sel=-1;
 bd.innerHTML=`<span class="lk" id="bk">← voltar</span><div class="fh">${im(s.im)}<div><b>${s.n!=null?'#'+s.n+' ':''}${esc(s.nm)}</b>${s.al.length?`<div class="mu">${esc(s.al.join(', '))}</div>`:''}<div class="mu">${esc(s.el.join(' / '))}</div></div></div>
 <h4>Onde nasce</h4>${s.lc.length?esc(s.lc.join(' · ')):'<span class="mu">Sem local cadastrado</span>'}
 <h4>Como obter (${m.length})</h4>${m.map(c=>rc(c,0)).join('')||'<span class="mu">Sem combinação</span>'}
 <h4>Usado em (${u.length})</h4>${u.map(c=>rc(c,1)).join('')||'<span class="mu">—</span>'}`;bd.scrollTop=0}
function mark(i){const r=bd.querySelectorAll('.row');if(!r.length)return;sel=Math.max(0,Math.min(i,r.length-1));
 r.forEach((e,j)=>e.classList.toggle('on',j==sel));r[sel].scrollIntoView({block:'nearest'})}
function open(){ico.hidden=true;pn.hidden=false;ov.size(true);qi.value='';list();qi.focus()}
function close(){pn.hidden=true;ico.hidden=false;ov.size(false)}
x.onclick=close;qi.oninput=list;
qi.onkeydown=e=>{
 if(e.key=='ArrowDown'){e.preventDefault();mark(sel+1)}
 else if(e.key=='ArrowUp'){e.preventDefault();mark(sel-1)}
 else if(e.key=='Enter'){const t=bd.querySelectorAll('.row')[Math.max(sel,0)];if(t)ficha(t.dataset.k)}
 else if(e.key=='Escape')close()};
bd.onclick=e=>{if(e.target.id=='bk'){list();return qi.focus()}const r=e.target.closest('[data-k]');if(r&&K[r.dataset.k])ficha(r.dataset.k)};
// ícone: arrastar move a janela; clique simples (sem arrastar) abre o painel
let drag=null;
ico.onpointerdown=e=>{if(e.button)return;ico.setPointerCapture(e.pointerId);drag={x:e.screenX,y:e.screenY,moved:false};ov.dragStart()};
ico.onpointermove=e=>{if(!drag)return;if(!drag.moved&&Math.hypot(e.screenX-drag.x,e.screenY-drag.y)>4)drag.moved=true;if(drag.moved)ov.dragMove()};
ico.onpointerup=()=>{const d=drag;drag=null;ov.dragEnd();if(d&&!d.moved)open()};
ov.onToggle(f=>f&&!pn.hidden?close():open()); // Ctrl+Tab
</script></body></html>
