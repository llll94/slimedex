<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Slimedex</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font:13px system-ui,sans-serif;color:#e8eaed;user-select:none}
#ico{position:relative;width:56px;height:56px;margin:4px;border-radius:50%;background:rgba(14,19,21,.72);display:flex;align-items:center;justify-content:center;cursor:grab;transition:transform .12s;box-shadow:0 2px 8px #0008;touch-action:none}
#ico:hover{transform:scale(1.12)}#ico:active{cursor:grabbing}#ico img{width:50px;pointer-events:none}
#pn{height:100%;display:flex;flex-direction:column;background:rgba(24,28,33,.95);border:1px solid #2d333a;border-radius:14px;overflow:hidden}
#hd{display:flex;gap:6px;padding:8px;-webkit-app-region:drag;border-bottom:1px solid #2d333a}#hd *{-webkit-app-region:no-drag}
input{flex:1;min-width:0;background:#14171a;color:inherit;border:1px solid #2d333a;border-radius:8px;padding:6px 9px;font:inherit;user-select:text}
input:focus{outline:none;border-color:#4d79c7}
button{background:none;border:0;color:#9aa3ad;font-size:16px;cursor:pointer}button:hover{color:#fff}
/* busca com × para limpar dentro do campo */
#qw{position:relative;flex:1;display:flex;min-width:0}#qw input{padding-right:26px}
#qx{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:20px;height:20px;line-height:18px;font-size:15px;border-radius:50%;padding:0}#qx:hover{background:#2b3440}
#bd{flex:1;overflow-y:auto;padding:6px 8px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a414a;border:2px solid transparent;border-radius:8px;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:#56606c}.mu{color:#9aa3ad;font-size:11px}
.row{display:flex;align-items:center;gap:8px;padding:4px 2px;border-radius:8px;cursor:pointer}.row:hover{background:#262c33}
.row.on{background:#2b3440;box-shadow:inset 0 0 0 1px #6aa8ff}
.row img,.row i{width:54px;height:54px;object-fit:contain;flex:none}
.fh{display:flex;gap:10px;align-items:center}.fh img{width:80px;height:80px;object-fit:contain}
h4{margin:10px 0 4px;font-size:11px;color:#9aa3ad;text-transform:uppercase}
.rc{padding:4px 0;border-top:1px solid #2d333a}.rc img{width:24px;height:24px;object-fit:contain}
.l1,.l2{display:flex;align-items:center;flex-wrap:wrap;gap:4px}.l2{margin-top:2px;min-height:20px}.l2>.mu:first-child{margin-left:2px}
.lk{color:#6aa8ff;cursor:pointer}.lk.sm{font-size:11px}
/* chance da combinação */
.pc{margin-left:auto;min-width:38px;text-align:center;padding:1px 6px;border-radius:9px;font-size:11px;font-weight:600;background:#1f3a2c;color:#7fe0a8;cursor:pointer}
.pc.vazio{background:transparent;color:#5c6670;border:1px dashed #3a414a;font-weight:400}.pc:hover{filter:brightness(1.3)}
.pc.ed{box-shadow:inset 0 0 0 1px #7fe0a8}
input.mini{flex:none;width:58px;margin-left:auto;padding:1px 6px;font-size:12px}
.vt{display:inline-flex;gap:2px}.pc+.vt{margin-left:4px} /* ordem: % e depois 👍/👎 */
.vb{display:inline-flex;align-items:center;gap:2px;padding:1px 4px;border-radius:7px;color:#5c6670;line-height:0}.vb svg{width:14px;height:14px;fill:currentColor}
.vb:hover{color:#9aa3ad}.vb.up.on{color:#7fe0a8;background:#1f3a2c}.vb.dn.on{color:#ff9a9a;background:#3d2226}
.vb i{font-style:normal;font-size:10px;line-height:14px;color:#9aa3ad}.vb.on i{color:inherit}
.meu{font-size:10px;padding:0 5px;border-radius:6px;background:#2b3440;color:#8fb8ff}
.del{cursor:pointer;font-size:11px;color:#9aa3ad}.del:hover{color:#ff7b7b}
/* ☆ fixar na tela */
.fv{cursor:pointer;color:#5c6670;font-size:15px;line-height:14px;margin-left:4px}.fv:hover,.fv.on{color:#ffd479}.fv.cheio{color:#ff7b7b}
/* formulário de nova combinação */
.form{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;padding:8px;margin:6px 0;border:1px solid #2d333a;border-radius:10px;background:#1b1f24}
.form input{padding:4px 8px}.form label{font-size:11px;color:#9aa3ad}
.bt{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.btn{font-size:12px;padding:4px 12px;border-radius:7px;background:#2b3440;color:#e8eaed}.btn:hover{background:#36414f;color:#fff}.btn.pri{background:#3a6fd8}.btn.pri:hover{background:#4a7fe8}
.err{color:#ff8a8a;font-size:11px;margin-right:auto}
.ok{color:#7fe0a8;font-size:12px}
/* vantagens elementais */
.eb{padding:4px 0;border-top:1px solid #2d333a}.eb b{font-size:12px}
.el-l{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-top:3px}.el-l .mu{width:58px;flex:none}
details.sec>summary{list-style:none;cursor:pointer;margin:10px 0 4px;font-size:11px;font-weight:700;color:#9aa3ad;text-transform:uppercase}
details.sec>summary::-webkit-details-marker{display:none}details.sec>summary::before{content:'▸ ';display:inline-block;width:12px}
details.sec[open]>summary::before{content:'▾ '}details.sec>summary:hover{color:#e8eaed}
.el{font-size:11px;padding:0 6px;border-radius:8px}.el.g{background:#1f3a2c;color:#7fe0a8}.el.r{background:#3d2226;color:#ff9a9a}
/* ajuda */
#inf{font-size:15px;font-weight:700;font-family:Georgia,serif;width:22px}
.info ul{margin:2px 0 6px;padding-left:16px}.info li{margin:3px 0;line-height:1.35}
kbd{font:600 10px system-ui;padding:1px 5px;border-radius:4px;background:#2b3440;border:1px solid #3a414a;border-bottom-width:2px;color:#e8eaed}
.lg{display:flex;gap:6px;margin:4px 0 8px}.lg .btn.on{background:#3a6fd8}
/* aviso de base nova da comunidade */
#anel{position:absolute;left:-4px;top:-4px;width:64px;height:64px;pointer-events:none}#anel svg{display:block;width:64px;height:64px}#anel circle{fill:none;stroke-width:3}
#anel .trilho{stroke:rgba(255,255,255,.14)}#anel .prog{stroke:#6fe6ff;stroke-linecap:round;transition:stroke-dashoffset .15s linear}
#anel.gira{animation:gira 1.4s linear infinite}#anel.ok .prog{stroke:#7fe0a8}#anel.erro .prog{stroke:#ff8a8a}@keyframes gira{to{transform:rotate(360deg)}}
#pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(14,19,21,.62);color:#fff;font:800 14px system-ui;font-style:normal;text-shadow:0 1px 2px #000;pointer-events:none}#pct.erro{color:#ff8a8a;font-size:20px}
#check{position:absolute;right:-1px;bottom:-1px;width:18px;height:18px;border-radius:50%;background:#2fb67a;color:#fff;font:700 11px/18px system-ui;text-align:center;font-style:normal;box-shadow:0 0 0 2px rgba(14,19,21,.9)}
#ponto{position:absolute;top:2px;right:2px;width:13px;height:13px;border-radius:50%;background:#7fe0a8;box-shadow:0 0 0 2px rgba(14,19,21,.9),0 0 8px #7fe0a8}
#rodape{display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 8px;border-top:1px solid #2d333a}#rodape .btn{flex:1;min-width:0;padding:7px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#avc{background:#1f6f5a}#avc:hover{background:#26846b}
</style></head><body>
<div id="ico"><img src="icon.svg" alt=""><i id="ponto" hidden></i><i id="anel" hidden><svg viewBox="0 0 64 64"><circle class="trilho" cx="32" cy="32" r="30"/><circle class="prog" id="anelp" cx="32" cy="32" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90 32 32)"/></svg></i><i id="pct" hidden></i><i id="check" hidden>✓</i></div>
<div id="pn" hidden><div id="hd"><div id="qw"><input id="qi"><button id="qx" hidden>×</button></div><button id="inf">i</button><button id="nv">＋</button><button id="mn">⋯</button><button id="x">✕</button></div><div id="bd"></div><div id="rodape"><span id="rst" class="mu"></span><button class="btn pri" id="avb" hidden></button><button class="btn" id="avc" hidden></button></div></div>
<datalist id="nomes"></datalist><datalist id="materiais"></datalist>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script>
const S=D.slimes,K={},BASE='https://world-of-slime-wiki.vercel.app';S.forEach(s=>K[s.k]=s);
S.forEach(s=>s.n0=s.n); // número da base (o número exibido pode vir do usuário ou da comunidade)
let ALL=[];const ordena=()=>{ALL=[...S].sort((a,b)=>(a.n??1e9)-(b.n??1e9)||a.nm.localeCompare(b.nm))};ordena(); // numerados primeiro, depois por nome
const norm=t=>(t||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const esc=t=>(t??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const im=p=>p?`<img alt="" src="imagens${p}" onerror="this.onerror=null;this.src='${BASE}${p}'">`:'<i class="mu">?</i>';
// ---- idioma: nomes, elementos, locais e materiais no idioma escolhido ----
const locN=l=>LANG==='en'?(D.locEn&&D.locEn[l])||l:l;
const IT={};(D.itens||[]).forEach(i=>[i.pt,i.en,i.pt+' ('+i.en+')'].forEach(v=>IT[norm(v)]=i));
const matN=m=>{const i=IT[norm(m)];return i?(LANG==='en'?i.en:i.pt):m}; // material da base/usuário traduzido quando conhecido
// ---- dados do usuário (meus-dados.json, via main): nomes PT, % editados e combinações próprias ----
let CM=null; // comunidade.json (merge diário): combos, pc, pt, votos
let CMnova=null,NOVA=null,ATUALIZADO=false,ultimaChecagem=Date.now(); // base nova já baixada, ainda não aplicada; NOVA = versão nova do app no GitHub
function novasCombos(){return CMnova?Math.max(0,(CMnova.combos||[]).length-((CM&&CM.combos)||[]).length):0}
let M={pt:{},pc:{},combos:[],votos:{},num:{},fav:[]},C=[],made={},used={},LBL={};
const cid=c=>c.id||[c.a,c.b,c.r,c.m].join('|'); // id estável de uma combinação da base
const chaveC=c=>[c.a,c.b].sort().join('+')+'>'+c.r; // mesmos slimes e resultado
const pcBase=c=>{const t=(c.nt||[]).join(' ').match(/(\d+(?:[.,]\d+)?)\s*%/);return t?parseFloat(t[1].replace(',','.')):null};
const dn=s=>LANG==='pt'?(s.pt||s.nm):s.nm,nm=k=>K[k]?dn(K[k]):k;
const alt=s=>LANG==='pt'?(s.pt?s.nm:''):(s.pt||''); // nome no outro idioma, se houver
function monta(){
 S.forEach(s=>{s.pt=M.pt[s.k]||(CM&&CM.pt&&CM.pt[s.k])||'';const nu=(M.num||{})[s.k]??(CM&&CM.num&&CM.num[s.k]);s.n=s.n0??(Number.isInteger(nu)?nu:null);
  s.h=norm([s.pt,s.nm,...s.al,s.n,s.el.join(' '),s.el.map(e=>EL_EN[e]||'').join(' '),s.lc.join(' '),s.lc.map(l=>(D.locEn&&D.locEn[l])||'').join(' ')].join(' '))});
 const cpc=(CM&&CM.pc)||{},cvt=(CM&&CM.votos)||{};
 const com=((CM&&Array.isArray(CM.combos))?CM.combos:[]).filter(c=>c&&typeof c.id=='string'&&K[c.r]&&K[c.a]&&K[c.b])
  .map(c=>({id:c.id,r:c.r,a:c.a,b:c.b,m:String(c.m||''),l:String(c.l||''),ch:c.id in M.pc?M.pc[c.id]:(typeof c.ch=='number'?c.ch:null),n:c.n|0,com:true,nt:[]}));
 C=[...D.combos.map(c=>{const id=cid(c),pb=pcBase(c);return{...c,ch:id in M.pc?M.pc[id]:pb!=null?pb:(cpc[id]&&typeof cpc[id].ch=='number'?cpc[id].ch:null)}}),...com,...M.combos.map(c=>({...c,meu:true}))];
 // combinação sua igual a uma da base/comunidade vira uma linha só, com o que cada uma tem de informação
 // c.alvo = presa a uma combinação da base/comunidade: modo 'editar' substitui os campos, 'juntar' só completa o que falta;
 // sem alvo, junta sozinha com a igual (mesmos slimes, mesmo resultado, material compatível)
 const matIgual=(x,y)=>!x||!y||norm(matN(x))===norm(matN(y)),idxC=new Map(),porCid=new Map();
 C.forEach(c=>{if(!c.meu&&c.r){const k=chaveC(c);(idxC.get(k)||idxC.set(k,[]).get(k)).push(c);porCid.set(cid(c),c)}});
 C=C.filter(c=>{if(!c.meu||!c.r)return true;let alvo,modo=c.modo||'juntar';
  if(c.alvo){alvo=porCid.get(c.alvo);if(!alvo||alvo.meuId)return true} // a original sumiu: mostra como sua
  else{alvo=(idxC.get(chaveC(c))||[]).find(o=>!o.meuId&&matIgual(o.m,c.m));if(!alvo)return true;modo='juntar'}
  if(modo==='editar'){alvo.m=c.m||'';alvo.l=c.l||'';if(!(cid(alvo) in M.pc))alvo.ch=c.ch??null;alvo.editado=true}
  else{if(!alvo.m&&c.m)alvo.m=c.m;if((alvo.l==null||alvo.l==='')&&c.l)alvo.l=c.l;if(!(cid(alvo) in M.pc)&&c.ch!=null)alvo.ch=c.ch} // sua chance vale, salvo % editado na linha
  alvo.meuId=c.id;return false});
 C.forEach(c=>{if(c.meu&&c.r){const o=C.find(x=>x!==c&&x.r&&chaveC(x)===chaveC(c));c.gemeo=o?cid(o):null}}); // igual que não juntou sozinha (⇄)
 C.forEach(c=>{const v=cvt[cid(c)];if(v&&typeof v=='object'){c.v={u:v.u|0,d:v.d|0};c.cz=c.v.d>=3&&c.v.d>=2*c.v.u}}); // placar e "contestada"
 made={};used={};
 C.forEach(c=>{if(c.r)(made[c.r]=made[c.r]||[]).push(c);new Set([c.a,c.b]).forEach(k=>(used[k]=used[k]||[]).push(c))});
 const byCh=(a,b)=>(b.ch??-1)-(a.ch??-1);Object.values(made).forEach(v=>v.sort(byCh)); // maior chance primeiro
 ordena();LBL={};nomes.innerHTML=ALL.map(s=>{const l=rot(s);LBL[l]=s.k;return`<option value="${esc(l)}">`}).join('');
 // sugestões do campo Material: "Couro (Hide)" em PT, "Hide (Couro)" em EN — acha digitando nas duas línguas
 materiais.innerHTML=(D.itens||[]).map(i=>`<option value="${esc(LANG==='en'?i.en+' ('+i.pt+')':i.pt+' ('+i.en+')')}">`).join('');
 syncFav()}
const rot=s=>`${s.n!=null?'#'+s.n+' ':''}${dn(s)}${s.el.length?' ('+s.el.map(elN).join('/')+')':''}`; // rótulo único da lista de sugestões
function salva(){return ov.meus.salvar(M)}
// nome digitado -> chave do slime: rótulo da lista, senão nome único (nome principal/PT antes de apelido)
function chave(v){v=(v||'').trim();if(LBL[v])return LBL[v];const n=norm(v);if(!n)return null;
 for(const f of [s=>[s.pt,s.nm],s=>s.al]){const h=S.filter(s=>f(s).some(x=>x&&norm(x)===n));if(h.length==1)return h[0].k;if(h.length>1)return null}return null}
// ---- histórico: últimas 3 fichas abertas ----
const REC='recentes';let rec=[];try{rec=(JSON.parse(localStorage.getItem(REC))||[]).filter(k=>K[k])}catch{}
function lembra(k){rec=[k,...rec.filter(x=>x!==k)].slice(0,3);try{localStorage.setItem(REC,JSON.stringify(rec))}catch{}}
let sel=-1,cur=null; // linha destacada pelo teclado; ficha aberta
function row(s){const a=alt(s);return`<div class="row" data-k="${esc(s.k)}">${im(s.im)}<div><b>${s.n!=null?'#'+s.n+' ':''}${esc(dn(s))}</b><div class="mu">${a?esc(a)+' · ':''}${esc(s.el.map(elN).join(' / '))}</div></div></div>`}
const voltarLk=()=>`<span class="lk" id="bk" title="${esc(t('back_title'))}">${t('back')}</span>`;
// ---- histórico de navegação: cada tela registra onde está; voltar() refaz a anterior ----
let vista=null,hist=[],voltando=false;
function marca(v){const igual=vista&&JSON.stringify(vista)===JSON.stringify(v);
 if(!voltando&&vista&&!igual&&!(vista.t=='lista'&&v.t=='lista')){hist.push(vista);if(hist.length>50)hist.shift()} // digitar na busca não empilha
 vista=v}
function voltar(){const v=hist.pop();if(!v){if(vista&&vista.t!='lista'){list();qi.focus()}return}
 voltando=true;try{if(v.t=='lista'){qi.value=v.q||'';list();qi.focus()}else if(v.t=='ficha'&&K[v.k])ficha(v.k)
  else if(v.t=='form')formCombo(v.r);else if(v.t=='meus')meus();else if(v.t=='envio')envio();else if(v.t=='info')info();else if(v.t=='novas')novidadesTela();else list()}finally{voltando=false}}
// re-desenha a tela atual (ex.: depois de trocar o idioma ou chegar a base da comunidade)
function redesenha(){const v=vista;if(!v)return;voltando=true;try{if(v.t=='ficha'&&K[v.k])ficha(v.k,true);else if(v.t=='lista')list();else if(v.t=='form')formCombo(v.r);else if(v.t=='meus')meus();else if(v.t=='envio')envio();else if(v.t=='info')info();else if(v.t=='novas')novidadesTela()}finally{voltando=false}}
function limpaX(){qx.hidden=!qi.value}
function list(){const q=qi.value.trim();sel=-1;cur=null;marca({t:'lista',q});limpaX();
 if(!q)bd.innerHTML=(rec.length?`<h4>${t('recent')}</h4>${rec.map(k=>row(K[k])).join('')}<h4>${t('all',{n:S.length})}</h4>`:'')+ALL.map(row).join('');
 else{const w=norm(q).split(/\s+/);bd.innerHTML=ALL.filter(s=>w.every(x=>s.h.includes(x))).map(row).join('')||`<p class="mu">${t('nothing')}</p>`}
 bd.scrollTop=0}
const lk=k=>K[k]?`<span class="lk" data-k="${esc(k)}">${esc(nm(k))}</span>`:esc(k||'?');
// votos 👍/👎: um por combinação (clicar de novo desfaz); c.v={u,d} e c.cz (contestada) vêm da base mesclada
// ícones: paths do Material Icons "thumb_up"/"thumb_down" (licença Apache 2.0)
const UP='<svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>';
const DN='<svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>';
const vt=c=>{const id=cid(c),v=M.votos[id]||0,p=c.v||{};return`<span class="vt"><button class="vb up${v==1?" on":""}" data-voto="${esc(id)}" data-v="1" title="${esc(t('up'))}">${UP}${p.u?`<i>${p.u}</i>`:""}</button><button class="vb dn${v==-1?" on":""}" data-voto="${esc(id)}" data-v="-1" title="${esc(t('down'))}">${DN}${p.d?`<i>${p.d}</i>`:""}</button></span>`};
// ☆ fixar na tela: M.fav guarda o id e uma cópia do que a janelinha mostra (vale mesmo se a combinação sumir da base)
const MAX_FAV=8,ehFav=c=>(M.fav||[]).some(f=>f.id===cid(c));
const fv=c=>{if(!c.r)return'';const on=ehFav(c);return`<span class="fv${on?' on':''}" data-fav="${esc(cid(c))}" title="${esc(t(on?'fav_off':'fav_title'))}">${on?'★':'☆'}</span>`};
const favDados=c=>({id:cid(c),r:c.r,l:c.l||'',m:c.m?matN(c.m):'',ch:c.ch??null,lv:t('lv'),lang:LANG,
 tx:{r:nm(c.r),a:nm(c.a),b:nm(c.b),fechar:t('pin_x'),dica:t('pin_tip')},
 im:Object.fromEntries(['r','a','b'].map(f=>{const p=K[c[f]]&&K[c[f]].im;return[f,p?['imagens'+p,BASE+p]:null]}))});
function syncFav(){const porId=new Map(C.map(c=>[cid(c),c]));
 M.fav=(Array.isArray(M.fav)?M.fav:[]).filter(f=>f&&typeof f.id=='string'&&f.tx).map(f=>{const c=porId.get(f.id);return c&&c.r?favDados(c):{...f,lv:t('lv'),lang:LANG,tx:{...f.tx,fechar:t('pin_x'),dica:t('pin_tip')}}});
 ov.fav.sync(M.fav)}
function favorita(id,el){const i=M.fav.findIndex(f=>f.id===id);

 qi.value='';hist=[];vista=null;list();qi.focus()}
function close(){const a=document.activeElement;if(a&&a.tagName=="INPUT"&&bd.contains(a))campo=a;pn.hidden=true;ico.hidden=false;ov.size(false)}
x.onclick=close;mn.onclick=()=>meus();nv.onclick=()=>formCombo(cur);inf.onclick=info;qi.oninput=list;
qx.onclick=()=>{qi.value='';list();qi.focus()}; // × dentro da busca
qi.onkeydown=e=>{
 if(e.key=='ArrowDown'){e.preventDefault();mark(sel+1)}
 else if(e.key=='ArrowUp'){e.preventDefault();mark(sel-1)}
 else if(e.key=='Enter'){const t=bd.querySelectorAll('.row')[Math.max(sel,0)];if(t)ficha(t.dataset.k)}
 else if(e.key=='Escape')close()};
bd.onclick=e=>{const t=e.target;
 if(t.id=='bk')return voltar();
 if(t.dataset.lang)return idioma(t.dataset.lang);
 if(t.dataset.pc)return editaChance(t);
 const vb=t.closest("[data-voto]");if(vb){const id=vb.dataset.voto,v=+vb.dataset.v;if(M.votos[id]===v)delete M.votos[id];else M.votos[id]=v;return atualiza()}
 if(t.dataset.fav)return favorita(t.dataset.fav,t);
 if(t.dataset.ed){const c=C.find(x=>cid(x)===t.dataset.ed);if(c)formCombo(c.r,{c,id:c.meu?c.id:c.meuId||null,alvo:c.meu?null:cid(c)});return}
 if(t.dataset.jn){juntar(t.dataset.jn);return}
 if(t.dataset.del){M.combos=M.combos.filter(c=>c.id!==t.dataset.del);M.fav=M.fav.filter(f=>f.id!==t.dataset.del);return atualiza()}
 if(t.id=='ptedit')return editaPT();
 if(t.id=='numedit')return editaNum();
 if(t.id=='addc')return formCombo(cur);
 const r=t.closest('[data-k]');if(r&&K[r.dataset.k])ficha(r.dataset.k)};
// ícone: arrastar move a janela; clique simples (sem arrastar) abre o painel
let drag=null;
ico.onpointerdown=e=>{if(e.button)return;ico.setPointerCapture(e.pointerId);drag={x:e.screenX,y:e.screenY,moved:false};ov.dragStart()};
ico.onpointermove=e=>{if(!drag)return;if(!drag.moved&&Math.hypot(e.screenX-drag.x,e.screenY-drag.y)>4)drag.moved=true;if(drag.moved)ov.dragMove()};
ico.onpointerup=()=>{const d=drag;drag=null;ov.dragEnd();if(d&&!d.moved)open()};
ov.onToggle(f=>f&&!pn.hidden?close():open()); // Ctrl+Tab
ov.onFechar(()=>{if(!pn.hidden)close()}); // clicou fora do painel
addEventListener('mousedown',e=>{if(e.button===3)e.preventDefault()});
ov.onVoltar(()=>{if(!pn.hidden)voltar()});
ov.fav.onRemovido(id=>{M.fav=M.fav.filter(f=>f.id!==id);atualiza()}); // × na combinação fixada
ov.fav.onAbrir(k=>{if(!K[k])return;if(pn.hidden)open();ficha(k)}); // clique na combinação fixada: abre a ficha // botão voltar do mouse no Windows (vem do main como app-command)
if(ov.plataforma==='darwin')addEventListener('mouseup',e=>{if(e.button===3&&!pn.hidden){e.preventDefault();voltar()}}); // no Mac chega como clique
// teclado fora de campos de texto: V = voltar, Esc = fechar, outra letra = começa a buscar
addEventListener('keydown',e=>{if(pn.hidden||e.ctrlKey||e.altKey||e.metaKey)return;const t=e.target;
 if(t.tagName=='INPUT'||t.tagName=='TEXTAREA'||t.isContentEditable)return;
 if(e.key=='v'||e.key=='V'){e.preventDefault();voltar()}
 else if(e.key=='Escape'){e.preventDefault();close()}
 else if(e.key.length===1&&e.key!==' '){qi.value='';qi.focus()}}); // a letra cai na busca vazia
estaticos();monta();ov.idioma(LANG);ov.versao().then(v=>{VERSAO=v;estaticos()}).catch(()=>{});ov.pasta().then(p=>PASTA=p).catch(()=>{});
ov.meus.ler().then(d=>{if(d&&typeof d=='object')M={pt:{},pc:{},combos:[],votos:{},num:{},fav:[],...d};monta()});
ov.comunidade().then(d=>{if(d&&typeof d=='object'){CM=d;monta();if(cur)ficha(cur,true)}}).catch(()=>{});
// ---- aviso de base nova da comunidade: bolinha no ícone + botão de reiniciar no rodapé ----
function avisa(){ponto.hidden=false;rst.hidden=true;avb.hidden=!NOVA;avc.hidden=!CMnova;estaticos()} // a pessoa escolhe: atualizar o app ou só a base
function verificaVersao(){ov.versaoNova().then(r=>{if(r&&r.versao){NOVA=r;avisa()}}).catch(()=>{})}
function verificaComunidade(){ultimaChecagem=Date.now();verificaVersao();ov.comunidade().then(d=>{
 if(!d||typeof d!='object'||!d.gerado||(CM&&d.gerado===CM.gerado))return; // nada novo
 CMnova=d;avisa()}).catch(()=>{})}
avb.onclick=()=>novidadesTela(); // versão nova: mostra o que mudou e pede confirmação
avc.onclick=()=>{avc.disabled=true;ov.reiniciar()}; // base nova: reinicia com as combinações novas
// ---- novidades da versão (para quem joga): todas as versões entre a atual e a nova ----
const comparaV=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++)if((x[i]||0)!==(y[i]||0))return(x[i]||0)-(y[i]||0);return 0};
function novidadesTela(){const n=NOVA;if(!n)return list();cur=null;sel=-1;marca({t:'novas'});
 bd.innerHTML=`${voltarLk()}<h4 id="nvh">${esc(t('novidades_h',{v:n.versao}))}</h4>
 <p style="margin:4px 0 0"><b>${esc(t(n.arquivo?'confirma_atualizar':'confirma_baixar',{v:n.versao}))}</b></p>
 <div class="bt" style="justify-content:flex-start;margin:8px 0 4px"><button class="btn pri" id="nvok">${n.arquivo?t('atualizar_agora'):t('baixar_mac')}</button><button class="btn" id="nvno">${t('depois')}</button></div>
 <div id="nvl" class="info"><p class="mu">…</p></div>`;
 nvno.onclick=voltar;nvok.onclick=iniciarAtualizacao;
 ov.novidades().then(d=>{if(!window.nvl||vista.t!=='novas')return;
  const L=((d&&d.versoes)||[]).filter(x=>x&&x.v&&comparaV(x.v,VERSAO||'0.0.0')>0&&comparaV(x.v,n.versao)<=0).sort((a,b)=>comparaV(b.v,a.v));
  if(L.length>1)nvh.textContent=t('novidades_varias',{v:VERSAO});
  nvl.innerHTML=L.length?L.map(x=>`<h4>${esc(t('versao_x',{v:x.v}))}</h4><ul>${(x[LANG]||x.pt||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`).join(''):`<p class="mu">${t('sem_novidades')}</p>`})
  .catch(()=>{if(window.nvl)nvl.innerHTML=`<p class="mu">${t('sem_novidades')}</p>`})}
// ---- atualizar: anel no ícone sobe até 90% em 10 s e segura; 100% quando o download termina e confere; aí reinicia ----
function iniciarAtualizacao(){const n=NOVA;if(!n)return;if(!n.arquivo){ov.baixarAtualizacao(n);return} // Mac: abre a página de download
 close();ponto.hidden=true;check.hidden=true;avc.hidden=true;anel.hidden=false;pct.hidden=false;pct.className='';anel.setAttribute('class','gira');avb.disabled=true;
 let perc=0,feito=false;const t0=Date.now(); // perc: % mostrado (o elemento da tela se chama pct)
 const pinta=p=>{anelp.style.strokeDashoffset=188.5*(1-p/100);pct.textContent=Math.round(p)+'%';const s=t('atualizando',{p:Math.round(p)});avb.textContent=s;ico.title=s};
 pinta(0);const tm=setInterval(()=>{if(feito)return;const s=Math.min(1,(Date.now()-t0)/10000);perc=90*(1-(1-s)*(1-s));pinta(perc)},100);
 const falhou=e=>{clearInterval(tm);anel.setAttribute('class','erro');pct.className='erro';pct.textContent='!';avb.disabled=false;avb.textContent=t('falha_atualizar',{e});ico.title=avb.textContent;
  setTimeout(()=>{anel.hidden=true;pct.hidden=true;ponto.hidden=false;avc.hidden=!CMnova;estaticos()},5000)};
 ov.baixarAtualizacao(n).then(r=>{if(!r||!r.ok)return falhou(r&&r.erro||'?');
  feito=true;clearInterval(tm);anel.setAttribute('class','ok');pinta(100);setTimeout(()=>ov.instalarAtualizacao(),800)}).catch(e=>falhou(e.message))}
// aberto logo depois de atualizar: ✓ verde no ícone por alguns segundos e "Atualizado para vX" no rodapé
ov.foiAtualizado().then(f=>{if(!f)return;ATUALIZADO=true;check.hidden=false;estaticos();setTimeout(()=>{check.hidden=true},8000)}).catch(()=>{});
setTimeout(verificaVersao,5000); // ao abrir o app, já confere se saiu versão nova
setInterval(verificaComunidade,60*60e3); // confere a cada 1 hora
</script></body></html>
